name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r api/requirements.txt
      - run: PYTHONPATH=api pytest api/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package.json}
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: docker compose build
      # Deployment would push the two images to the selected registry after this job succeeds.
      # Runtime secrets belong in the deployment platform's secret store, never in this repository.

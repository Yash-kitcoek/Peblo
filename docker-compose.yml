services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo
      STORAGE_DIR: /app/data/storage
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [./seed_shows.json:/app/seed_shows.json:ro, ./reference.json:/app/reference.json:ro, api_storage:/app/data]
    depends_on:
      db: {condition: service_healthy}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  api_storage:
